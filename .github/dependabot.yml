# Weekly pull requests for outdated or vulnerable dependencies (security fixes
# also arrive as soon as an advisory is published). Minor and patch updates are
# grouped into one PR per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
