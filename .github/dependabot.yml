# Pull requests for outdated or vulnerable dependencies. Security fixes come
# right away; routine updates weekly, minor and patch only, grouped per
# ecosystem. Major versions are done by hand. Every PR must pass the "Checks"
# workflow before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Gemini SDK changes its internals often; upgraded on purpose.
      - dependency-name: google-genai
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
