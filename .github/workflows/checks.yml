# Runs on every pull request (Dependabot's too) and on main: installs exactly
# the pinned dependencies, then the same checks as the README. A red result
# means: don't merge.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check . && ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # The admin pages the tests render need the static-file manifest.
      - run: python manage.py collectstatic --noinput -v0
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
